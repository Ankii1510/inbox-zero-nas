<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Initial Skill Package — inbox-zero-nas</title>
  <style>
    :root { --bg:#f4f7f5; --ink:#14241d; --muted:#4d675c; --card:#fff; --line:#d7e4dc; --accent:#1f7a52; --code:#0f1f1a; }
    body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:linear-gradient(180deg,#eef6f1,#f4f7f5); color:var(--ink); }
    main { max-width:920px; margin:0 auto; padding:32px 18px 64px; }
    .top { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
    .top a { text-decoration:none; background:var(--accent); color:#fff; padding:10px 14px; border-radius:10px; font-weight:700; }
    .top a.secondary { background:#fff; color:var(--accent); border:1px solid var(--accent); }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; }
    .tabs button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 12px; cursor:pointer; }
    .tabs button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px; box-shadow:0 10px 30px rgba(20,36,29,.06); }
    #content { line-height:1.65; }
    #content h1,#content h2,#content h3 { line-height:1.25; }
    #content pre, #content code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #content pre { background:var(--code); color:#e8f2ec; padding:14px; border-radius:12px; overflow:auto; }
    #content code { background:#e8f1ec; padding:2px 6px; border-radius:6px; }
    #content pre code { background:transparent; padding:0; color:inherit; }
    #content table { border-collapse:collapse; width:100%; }
    #content th,#content td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
    #status { color:var(--muted); margin-bottom:10px; }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div>
        <h1 style="margin:0 0 4px; font-size:1.5rem;">Initial Skill Package</h1>
        <div style="color:var(--muted)">inbox-zero-nas · static-pass · Markdown-only Uliya Skill</div>
      </div>
      <a class="secondary" href="./skill-package-download.html">Download ZIP</a>
      <a href="https://github.com/Ankii1510/inbox-zero-nas/tree/main/submission/inbox-zero-nas">GitHub folder</a>
    </div>
    <div class="tabs" id="tabs"></div>
    <p id="status">Loading…</p>
    <article class="card"><div id="content"></div></article>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const files = [
      { id: 'skill', label: 'SKILL.md', path: '../submission/inbox-zero-nas/SKILL.md' },
      { id: 'rules', label: 'classification-rules.md', path: '../submission/inbox-zero-nas/references/classification-rules.md' },
      { id: 'safety', label: 'safety.md', path: '../submission/inbox-zero-nas/references/safety.md' },
      { id: 'disc', label: 'disclosures.md', path: '../submission/inbox-zero-nas/references/disclosures.md' }
    ];
    const tabs = document.getElementById('tabs');
    const content = document.getElementById('content');
    const status = document.getElementById('status');
    const cache = {};

    async function show(file) {
      [...tabs.querySelectorAll('button')].forEach(b => b.classList.toggle('active', b.dataset.id === file.id));
      status.textContent = 'Loading ' + file.label + '…';
      try {
        if (!cache[file.id]) {
          const res = await fetch(file.path);
          if (!res.ok) throw new Error('Failed to load ' + file.label);
          cache[file.id] = await res.text();
        }
        content.innerHTML = marked.parse(cache[file.id]);
        status.textContent = file.label;
      } catch (e) {
        status.textContent = e.message;
        content.textContent = '';
      }
    }

    files.forEach(file => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = file.label;
      btn.dataset.id = file.id;
      btn.onclick = () => show(file);
      tabs.appendChild(btn);
    });
    show(files[0]);
  </script>
</body>
</html>
