<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Proposal — Inbox Zero for NAS</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; background:#0f1f1a; color:#e8f2ec; display:grid; place-items:center; min-height:100vh; margin:0; }
    .card { background:#173028; border:1px solid #2c5a48; border-radius:16px; padding:28px; max-width:520px; }
    button { margin-top:12px; padding:12px 16px; border:0; border-radius:10px; background:#3dcf8e; color:#062016; font-weight:700; cursor:pointer; }
    a { color:#9be7c4; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Project Proposal (PDF)</h1>
    <p>Inbox Zero for NAS — UGREEN Hackathon 2026 Round 1.</p>
    <button id="btn" type="button">Download project-proposal.pdf</button>
    <p id="status">Preparing download…</p>
    <p><a href="https://github.com/Ankii1510/inbox-zero-nas">Source repo</a></p>
  </div>
  <script>
    async function download() {
      const status = document.getElementById('status');
      try {
        status.textContent = 'Fetching proposal…';
        const res = await fetch('../submission/project-proposal.pdf.b64');
        if (!res.ok) throw new Error('Could not load proposal');
        const b64 = (await res.text()).trim();
        const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const blob = new Blob([bin], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'project-proposal.pdf';
        a.click();
        URL.revokeObjectURL(url);
        status.textContent = 'Downloaded project-proposal.pdf';
      } catch (e) {
        status.textContent = e.message;
      }
    }
    document.getElementById('btn').onclick = download;
    download();
  </script>
</body>
</html>
