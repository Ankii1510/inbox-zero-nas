<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Download Initial Skill Package</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; background:#0f1f1a; color:#e8f2ec; display:grid; place-items:center; min-height:100vh; margin:0; }
    .card { background:#173028; border:1px solid #2c5a48; border-radius:16px; padding:28px; max-width:560px; }
    button { margin-top:12px; padding:12px 16px; border:0; border-radius:10px; background:#3dcf8e; color:#062016; font-weight:700; cursor:pointer; }
    a { color:#9be7c4; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Initial Skill Package (ZIP)</h1>
    <p><code>inbox-zero-nas.zip</code> — Uliya Skill package for preliminary technical review. Checker status: static-pass.</p>
    <button id="btn" type="button">Download inbox-zero-nas.zip</button>
    <p id="status">Preparing download…</p>
    <p><a href="./skill-package-read.html">Read package online</a> · <a href="https://github.com/Ankii1510/inbox-zero-nas/tree/main/submission/inbox-zero-nas">Browse on GitHub</a></p>
  </div>
  <script>
    async function download() {
      const status = document.getElementById('status');
      try {
        status.textContent = 'Fetching Skill ZIP…';
        const res = await fetch('../submission/inbox-zero-nas.zip.b64');
        if (!res.ok) throw new Error('Could not load Skill ZIP');
        const b64 = (await res.text()).trim();
        const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const url = URL.createObjectURL(new Blob([bin], { type: 'application/zip' }));
        const a = document.createElement('a');
        a.href = url; a.download = 'inbox-zero-nas.zip'; a.click();
        URL.revokeObjectURL(url);
        status.textContent = 'Downloaded inbox-zero-nas.zip';
      } catch (e) { status.textContent = e.message; }
    }
    document.getElementById('btn').onclick = download;
    download();
  </script>
</body>
</html>
