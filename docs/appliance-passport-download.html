<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Download Appliance Passport ZIP</title>
<style>body{font-family:ui-sans-serif,system-ui,sans-serif;background:#10241c;color:#e8f6ef;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#173028;border:1px solid #2c5a48;border-radius:16px;padding:28px;max-width:560px}button{margin-top:12px;padding:12px 16px;border:0;border-radius:10px;background:#3dcf8e;color:#062016;font-weight:700;cursor:pointer}a{color:#9be7c4}</style></head>
<body><div class="card"><h1>Initial Skill Package</h1><p><code>appliance-passport.zip</code> for Most Creative / Open Innovation. Checker: static-pass. Markdown only.</p><button id="btn" type="button">Download appliance-passport.zip</button><p id="status">Preparing download…</p><p><a href="./appliance-proposal-read.html">Read the proposal</a></p></div>
<script>
async function download(){const status=document.getElementById('status');try{status.textContent='Fetching Skill ZIP…';const res=await fetch('../submission/appliance-passport.zip.b64');if(!res.ok)throw new Error('Could not load ZIP');const b64=(await res.text()).trim();const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bin],{type:'application/zip'}));const a=document.createElement('a');a.href=url;a.download='appliance-passport.zip';a.click();URL.revokeObjectURL(url);status.textContent='Downloaded appliance-passport.zip';}catch(e){status.textContent=e.message;}}
document.getElementById('btn').onclick=download;download();
</script></body></html>
